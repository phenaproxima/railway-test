# Docker Compose file for running your Drupal CMS site.
services:
  web:
    build: .
    ports:
      - 8080:8080
    volumes:
      - ./files:/opt/drupal/web/sites/default/files
    environment:
      DRUSH_OPTIONS_URI: "localhost:8080"
    env_file:
      - .env
